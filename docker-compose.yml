# RessourcesPéda — déploiement complet (Lot 6).
#
#   Production : docker compose up -d --build
#   Démonstration : docker compose --profile demo run --rm seed   (après le premier démarrage)
#   Développement : docker compose --profile dev up -d db mailpit (puis npm run dev)
#   Stockage S3 (MinIO) : docker compose --profile s3 up -d, avec STORAGE_DRIVER=s3 dans .env
#
# Toutes les valeurs sensibles viennent du fichier .env (voir .env.example).
name: ressources-peda

x-app-env: &app-env
  DATABASE_URL: mysql://ressources:${MARIADB_PASSWORD:?définir MARIADB_PASSWORD dans .env}@db:3306/ressources_peda
  STORAGE_LOCAL_DIR: /data/storage

services:
  app:
    build: .
    image: ressources-peda:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?définir MARIADB_ROOT_PASSWORD dans .env}
      MARIADB_DATABASE: ressources_peda
      MARIADB_USER: ressources
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    # Port publié sur la machine hôte uniquement (administration, développement).
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mariadb/ressources.cnf:/etc/mysql/conf.d/ressources.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # Notifications programmées et anonymisation des consultations anciennes, toutes les 10 minutes.
  cron:
    image: ressources-peda:latest
    restart: unless-stopped
    entrypoint: ["node", "docker/cron.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?définir CRON_SECRET dans .env}
      CRON_TARGET: http://app:3000/api/cron/notifications
    depends_on:
      - app

  # Sauvegarde quotidienne de la base et des fichiers dans ./backups (rétention 14 jours).
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INITIAL_DELAY_SECONDS: ${BACKUP_INITIAL_DELAY_SECONDS:-60}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - storage:/data/storage:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Données de démonstration : docker compose --profile demo run --rm seed
  seed:
    profiles: ["demo"]
    build:
      context: .
      target: tools
    env_file: .env
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  # Capture des courriels en développement : http://localhost:8025
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # Stockage compatible S3 auto-hébergé (A15) : console http://localhost:9001
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

volumes:
  dbdata:
  storage:
  minio:
